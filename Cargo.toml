[package]
name = "shr-rec"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "Standalone multichannel recorder/player for a 40x13 terminal"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0"
crossterm = "0.26"
ratatui = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
signal-hook = "0.3"
rtrb = "0.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
